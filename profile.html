<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Levy</title>
</head>
<body class="homeBody">
    <nav class="homeSideNavBar">
      <h2 class="homeHeading">Levy</h2>
      <div class="sideBarItem" id="home">
        <i class="fa-solid fa-house"></i><span>Home</span>
      </div>
      <div class="sideBarItem" id="SavedPage">
        <i class="fa-solid fa-bullseye"></i><span>Goals</span>
      </div>
      <div class="sideBarItem" id="AddButton">
        <i class="fa-solid fa-circle-user"></i><span>Profile</span>
      </div>
      <div class="sideBarItem" id="Logout">
        <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span>
      </div>
  </nav>

  <section class="profileCenterSection">
    <div class="profileSection">
      <h2 class="goalName">Profile</h2>

      <p class="progressLabel">Email</p>
      <p class="goalAmount" id="profileEmail"></p>

      <p class="progressLabel" style="margin-top:20px;">Display Name</p>
      <input type="text" id="displayNameInput" class="loginInput">
      <button class="loginSubmitButton" id="saveNameButton">Save</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="profile.js"></script>
</body>
</html>
