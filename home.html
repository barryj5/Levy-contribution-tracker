<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Levy</title>
</head>
<body class="homeBody">
    <nav class="homeSideNavBar">
      <h2 class="homeHeading">Levy</h2>
      <div class="sideBarItem" id="home">
      <i class="fa-solid fa-house"></i><span>Home</span>
      </div>
      <div class="sideBarItem" id="SavedPage">
        <i class="fa-solid fa-bullseye"></i><span>Goals</span>
      </div>
      <div class="sideBarItem" id="AddButton">
        <i class="fa-solid fa-circle-user"></i><span>Profile</span>
      </div>
      <div class="sideBarItem" id="Logout">
        <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span>
      </div>
  </nav>
  <section>
    <div class="overallProgressWrapper">
      <svg width="240" height="240" viewBox="0 0 120 120" class="overallRing">
        <circle cx="60" cy="60" r="50" stroke="#333" stroke-width="10" fill="none"/>
      <circle cx="60" cy="60" r="50" stroke="#c9a24b" stroke-width="10" fill="none"
      stroke-dasharray="314" stroke-dashoffset="140"
      stroke-linecap="round" transform="rotate(-90 60 60)"
      class="overallRingFill" id="overallRingFill"/>
      </svg>
      <span class="overallPercentText" id="overallPercentText">55%</span>
    </div>
    <div class="goalsGrid" id="goalsGrid"></div>

    <h3 class="goalName" style="margin-top:50px;">Completed Goals</h3>
    <div id="completedSection"></div>
  </section>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="home.js"></script>
</html>
